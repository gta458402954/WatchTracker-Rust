name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend and Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright test

  rust:
    name: Rust checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked

  windows-bundle:
    name: Windows Tauri bundle
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [frontend, rust]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag matches project versions
        shell: pwsh
        run: node scripts/verify-release-version.mjs $env:GITHUB_REF_NAME
      - name: Install Rust stable
        run: rustup toolchain install stable --profile minimal
      - run: npm ci
      - run: npm run tauri build
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: watchtracker-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/release/app.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $app = Get-Item "src-tauri/target/release/app.exe"
          $msi = @(Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" -File)
          $nsis = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -File)

          if ($msi.Count -eq 0 -or $nsis.Count -eq 0) {
            throw "Expected app.exe, an MSI installer, and an NSIS setup executable."
          }

          $assets = @($app.FullName)
          $assets += @($msi | ForEach-Object FullName)
          $assets += @($nsis | ForEach-Object FullName)

          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --fail-on-no-commits `
            --generate-notes `
            --title "WatchTracker $env:GITHUB_REF_NAME"
